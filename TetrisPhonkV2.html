<script>

/* =========================================================

const BOARD_WIDTH = 10;
const BOARD_HEIGHT = 20;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const nextCanvas = document.getElementById("nextCanvas");
const nextCtx = nextCanvas.getContext("2d");

const CELL_SIZE = canvas.width / BOARD_WIDTH;


/* =========================================================
   COLORES DE LAS PIEZAS

const COLORS = [

    "#00eaff", // I
    "#ffe600", // O

    "#00ff66", // S
    "#ff304f", // Z
    "#2878ff", // J

/* =========================================================
   PIEZAS
   =========================================================

   0 = I
   1 = O
   2 = T
   3 = S
   4 = Z
   5 = J
   6 = L

   Exactamente basadas en tu código C++.
   ========================================================= */

const SHAPES = [

/* =========================================================
   ESTADO DEL JUEGO

let board;

let currentPiece;
let nextPiece;

let score = 0;
let lines = 0;
let level = 1;

let gameOver = false;
let paused = false;
let gameRunning = false;

let lastFall = 0;

let musicEnabled = true;

const songs = [
    "music1.mp3",
    "music2.mp3",
    "music3.mp3",
    "music4.mp3"
];

let currentSong = -1;
let musicVolume = 0.60;

const music = document.getElementById("music");
music.volume = musicVolume;

function playRandomSong() {

    if (!musicEnabled || songs.length === 0)
        return;

    let newSong;

    do {
        newSong =
            Math.floor(Math.random() * songs.length);
    }
    while (
        songs.length > 1 &&
        newSong === currentSong
    );

    currentSong = newSong;

    music.src = songs[currentSong];
    music.currentTime = 0;

    music.play().catch(() => {
        console.log(
            "El navegador bloqueó la reproducción automática."
        );
    });
}

function setVolume(value) {

    musicVolume =
        Math.max(
            0,
            Math.min(1, value)
        );

    music.volume = musicVolume;

    const percent =
        Math.round(musicVolume * 100);

    document
        .getElementById("volumeSlider")
        .value = percent;

    document
        .getElementById("volumeValue")
        .textContent = percent + "%";
}

function changeVolume(amount) {
    setVolume(musicVolume + amount);
}

music.addEventListener("ended", function() {
    if (musicEnabled) {
        playRandomSong();
    }
});


/* =========================================================
   CREAR TABLERO
   ========================================================= */

function createBoard() {

    board = [];

    for (let y = 0; y < BOARD_HEIGHT; y++) {

        board[y] = [];

        for (let x = 0; x < BOARD_WIDTH; x++) {

            board[y][x] = 0;

        }
    }
}


/* =========================================================
   CREAR PIEZA
   ========================================================= */

function createPiece() {

    return {

        type: Math.floor(Math.random() * 7),

        rotation: 0,

        x: Math.floor(BOARD_WIDTH / 2) - 2,

        y: 0

    };
}


/* =========================================================
   COLISIÓN
   ========================================================= */

function collision(piece) {

    const shape =
        SHAPES[piece.type][piece.rotation];

    for (let py = 0; py < 4; py++) {

        for (let px = 0; px < 4; px++) {

            if (!shape[py][px])
                continue;

            const boardX = piece.x + px;
            const boardY = piece.y + py;

            if (boardX < 0)
                return true;

            if (boardX >= BOARD_WIDTH)
                return true;

            if (boardY >= BOARD_HEIGHT)
                return true;

            if (
                boardY >= 0 &&
                board[boardY][boardX] !== 0
            ) {
                return true;
            }
        }
    }

    return false;
}


/* =========================================================
   BLOQUEAR PIEZA
   ========================================================= */

function lockPiece(piece) {

    const shape =
        SHAPES[piece.type][piece.rotation];

    for (let py = 0; py < 4; py++) {

        for (let px = 0; px < 4; px++) {

            if (!shape[py][px])
                continue;

            const x = piece.x + px;
            const y = piece.y + py;

            if (
                x >= 0 &&
                x < BOARD_WIDTH &&
                y >= 0 &&
                y < BOARD_HEIGHT
            ) {

                board[y][x] =
                    piece.type + 1;
            }
        }
    }
}


/* =========================================================
   LIMPIAR LÍNEAS
   ========================================================= */

function clearLines() {

    let cleared = 0;

    for (
        let y = BOARD_HEIGHT - 1;
        y >= 0;
        y--
    ) {

        let complete = true;

        for (let x = 0; x < BOARD_WIDTH; x++) {

            if (board[y][x] === 0) {

                complete = false;
                break;

            }
        }

        if (complete) {

            board.splice(y, 1);

            board.unshift(
                new Array(BOARD_WIDTH).fill(0)
            );

            cleared++;

            y++;
        }
    }

    return cleared;
}


/* =========================================================
   PUNTUACIÓN
   ========================================================= */

function addLineScore(cleared) {

    if (cleared === 1) {

        score += 100 * level;

    }
    else if (cleared === 2) {

        score += 300 * level;

    }
    else if (cleared === 3) {

        score += 500 * level;

    }
    else if (cleared === 4) {

        score += 800 * level;

    }

    lines += cleared;

    level =
        Math.floor(lines / 10) + 1;

}


/* =========================================================
   ROTACIÓN
   ========================================================= */

function rotatePiece() {

    let rotated = {

        ...currentPiece,

        rotation:
            (currentPiece.rotation + 1) % 4

    };

    if (!collision(rotated)) {

        currentPiece = rotated;
        return;

    }

    rotated.x =
        currentPiece.x - 1;

    if (!collision(rotated)) {

        currentPiece = rotated;
        return;

    }

    rotated.x =
        currentPiece.x + 1;

    if (!collision(rotated)) {

        currentPiece = rotated;
        return;

    }

    rotated.x =
        currentPiece.x - 2;

    if (!collision(rotated)) {

        currentPiece = rotated;
        return;

    }

    rotated.x =
        currentPiece.x + 2;

    if (!collision(rotated)) {

        currentPiece = rotated;

    }
}


/* =========================================================
   HARD DROP
   ========================================================= */

function hardDrop() {

    let distance = 0;

    while (true) {

        const test = {

            ...currentPiece,

            y: currentPiece.y + 1

        };

        if (collision(test))
            break;

        currentPiece.y++;
        distance++;
    }

    score += distance * 2;

    placePiece();
}


/* =========================================================
   COLOCAR PIEZA
   ========================================================= */

function placePiece() {

    lockPiece(currentPiece);

    const cleared = clearLines();

    addLineScore(cleared);

    currentPiece = nextPiece;

    nextPiece = createPiece();

    if (collision(currentPiece)) {

        endGame();
    }

}


/* =========================================================
   VELOCIDAD
   ========================================================= */

function getFallDelay() {

    let delay =
        600 - ((level - 1) * 65);

    if (delay < 70)
        delay = 70;

    return delay;
}


/* =========================================================
   GHOST PIECE
   ========================================================= */

function getGhostPiece() {

    const ghost = {
        ...currentPiece
    };

    while (true) {

        const test = {
            ...ghost,
            y: ghost.y + 1
        };

        if (collision(test))
            break;

        ghost.y++;
    }

    return ghost;
}


/* =========================================================
   DIBUJAR BLOQUE
   ========================================================= */

function drawBlock(
    context,
    x,
    y,
    size,
    color,
    alpha = 1
) {

    context.globalAlpha = alpha;

    context.fillStyle = color;

    context.fillRect(
        x + 1,
        y + 1,
        size - 2,
        size - 2
    );

    context.strokeStyle =
        "rgba(255,255,255,0.3)";

    context.strokeRect(
        x + 1,
        y + 1,
        size - 2,
        size - 2
    );

    context.globalAlpha = 1;
}


/* =========================================================
   DIBUJAR TABLERO
   ========================================================= */

function drawBoard() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /* Fondo */

    ctx.fillStyle = "#08050d";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Cuadrícula */

    ctx.strokeStyle =
        "rgba(255,255,255,0.045)";

    ctx.lineWidth = 1;

    for (let x = 0; x <= BOARD_WIDTH; x++) {

        ctx.beginPath();

        ctx.moveTo(
            x * CELL_SIZE,
            0
        );

        ctx.lineTo(
            x * CELL_SIZE,
            canvas.height
        );

        ctx.stroke();
    }

    for (let y = 0; y <= BOARD_HEIGHT; y++) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y * CELL_SIZE
        );

        ctx.lineTo(
            canvas.width,
            y * CELL_SIZE
        );

        ctx.stroke();
    }


    /* Piezas bloqueadas */

    for (let y = 0; y < BOARD_HEIGHT; y++) {

        for (let x = 0; x < BOARD_WIDTH; x++) {

            const value = board[y][x];

            if (value !== 0) {

                drawBlock(
                    ctx,
                    x * CELL_SIZE,
                    y * CELL_SIZE,
                    CELL_SIZE,
                    COLORS[value]
                );

            }
        }
    }


    /* Ghost */

    if (
        currentPiece &&
        gameRunning &&
        !gameOver
    ) {

        const ghost =
            getGhostPiece();

        drawPiece(
            ctx,
            ghost,
            true
        );
    }


    /* Pieza actual */

    if (
        currentPiece &&
        !gameOver
    ) {

        drawPiece(
            ctx,
            currentPiece,
            false
        );

    }
}


/* =========================================================
   DIBUJAR PIEZA
   ========================================================= */

function drawPiece(
    context,
    piece,
    ghost = false
) {

    const shape =
        SHAPES[piece.type][piece.rotation];

    for (let py = 0; py < 4; py++) {

        for (let px = 0; px < 4; px++) {

            if (!shape[py][px])
                continue;

            const x =
                (piece.x + px) * CELL_SIZE;

            const y =
                (piece.y + py) * CELL_SIZE;

            if (ghost) {

                drawBlock(
                    context,
                    x,
                    y,
                    CELL_SIZE,
                    COLORS[piece.type + 1],
                    0.15
                );

            }
            else {

                drawBlock(
                    context,
                    x,
                    y,
                    CELL_SIZE,
                    COLORS[piece.type + 1],
                    1
                );

            }
        }
    }
}


/* =========================================================
   PRÓXIMA PIEZA
   ========================================================= */

function drawNextPiece() {

    nextCtx.clearRect(
        0,
        0,
        nextCanvas.width,
        nextCanvas.height
    );

    nextCtx.fillStyle = "#08050d";

    nextCtx.fillRect(
        0,
        0,
        nextCanvas.width,
        nextCanvas.height
    );

    if (!nextPiece)
        return;

    const shape =
        SHAPES[nextPiece.type][0];

    const size = 22;

    const offsetX = 15;
    const offsetY = 5;

    for (let py = 0; py < 4; py++) {

        for (let px = 0; px < 4; px++) {

            if (!shape[py][px])
                continue;

            drawBlock(
                nextCtx,
                offsetX + px * size,
                offsetY + py * size,
                size,
                COLORS[nextPiece.type + 1]
            );
        }
    }
}


/* =========================================================
   ACTUALIZAR INTERFAZ
   ========================================================= */

function updateUI() {

    document.getElementById("score")
        .textContent = score;

    document.getElementById("level")
        .textContent = level;

    document.getElementById("lines")
        .textContent = lines;

    drawNextPiece();
}


/* =========================================================
   BUCLE PRINCIPAL
   ========================================================= */

function gameLoop(timestamp) {

    if (!gameRunning)
        return;

    if (!paused && !gameOver) {

        const delay =
            getFallDelay();

        if (
            timestamp - lastFall >= delay
        ) {

            const test = {

                ...currentPiece,

                y: currentPiece.y + 1

            };

            if (!collision(test)) {

                currentPiece.y++;

            }
            else {

                placePiece();

            }

            lastFall = timestamp;
        }

    }

    drawBoard();

    updateUI();

    requestAnimationFrame(gameLoop);
}


/* =========================================================
   MOVER PIEZA
   ========================================================= */

function movePiece(direction) {

    if (
        !gameRunning ||
        paused ||
        gameOver
    )
        return;

    const test = {

        ...currentPiece,

        x:
            currentPiece.x + direction

    };

    if (!collision(test)) {

        currentPiece.x += direction;

    }

}


/* =========================================================
   BAJAR PIEZA
   ========================================================= */

function softDrop() {

    if (
        !gameRunning ||
        paused ||
        gameOver
    )
        return;

    const test = {

        ...currentPiece,

        y: currentPiece.y + 1

    };

    if (!collision(test)) {

        currentPiece.y++;

        score++;

    }
    else {

        placePiece();

    }
}


/* =========================================================
   TECLADO
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (!gameRunning)
            return;

        const key =
            event.key.toLowerCase();


        /* Evitar scroll */

        if (
            key === " " ||
            key === "arrowleft" ||
            key === "arrowright" ||
            key === "arrowdown" ||
            key === "arrowup"
        ) {

            event.preventDefault();

        }


        if (key === "a" || key === "arrowleft") {

            movePiece(-1);

        }

        else if (
            key === "d" ||
            key === "arrowright"
        ) {

            movePiece(1);

        }

        else if (
            key === "s" ||
            key === "arrowdown"
        ) {

            softDrop();

        }

        else if (
            key === "w" ||
            key === "arrowup"
        ) {

            if (!paused)
                rotatePiece();

        }

        else if (key === " ") {

            if (!paused)
                hardDrop();

        }

        else if (key === "p") {

            togglePause();

        }

        else if (key === "escape") {

            exitGame();

        }

    }
);

function togglePause() {

    if (
        !gameRunning ||
        gameOver
    )
        return;

    paused = !paused;

    const button =
        document.getElementById(
            "pauseButton"
        );

        document
            .getElementById("menuButton")
            .classList.remove("hidden");

        document
            .getElementById("gameOverlay")
            .classList.remove("hidden");

    else {

        document

        }

    }
}
